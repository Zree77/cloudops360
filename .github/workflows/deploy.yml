name: CloudOps360 CI/CD

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  test:
    name: Test Application
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run tests
        run: python -m pytest tests -v

  deploy:
    name: Deploy Lambda
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials using OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::658469473117:role/CloudOps360-GitHubActions-Role
          aws-region: ap-south-1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build Lambda package
        run: |
          mkdir -p lambda_package
          python -m pip install \
            --platform manylinux2014_x86_64 \
            --implementation cp \
            --python-version 3.12 \
            --only-binary=:all: \
            --target lambda_package \
            -r lambda_requirements.txt
          cp -r app lambda_package/app
          cd lambda_package
          zip -r ../cloudops360-lambda.zip .

      - name: Deploy Lambda
        run: |
          aws lambda update-function-code \
            --function-name cloudops360-dev-api \
            --zip-file fileb://cloudops360-lambda.zip \
            --region ap-south-1

      - name: Wait for deployment
        run: |
          aws lambda wait function-updated \
            --function-name cloudops360-dev-api \
            --region ap-south-1

      - name: Smoke test
        run: |
          API_URL="https://tktticigxk.execute-api.ap-south-1.amazonaws.com"
          curl --fail --show-error --silent "$API_URL/health"